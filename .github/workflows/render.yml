name: Render Book

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
  pull_request:
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Render (HTML + PDF)
        run: quarto render

      - name: Upload book artifact
        uses: actions/upload-artifact@v4
        with:
          name: book
          path: _book/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _book/

  # Publish the rendered book to GitHub Pages — only for pushes to main, so PRs
  # still get a render check without deploying. Live site:
  # https://jlhf80.github.io/mmm_foundational_text/
  deploy:
    needs: render
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
