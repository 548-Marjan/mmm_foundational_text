name: Render Book

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
  pull_request:
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # TinyTeX installs LaTeX packages on demand during the PDF build via
      # tlmgr; a transient CTAN/network hiccup (e.g. a failed luatexbase.sty
      # fetch) hard-stops LuaLaTeX. Retry once so such flakes self-recover.
      # A genuine content error still fails (just on the second attempt too).
      - name: Render (HTML + PDF)
        run: |
          for attempt in 1 2; do
            echo "::group::quarto render (attempt $attempt)"
            if quarto render; then echo "::endgroup::"; exit 0; fi
            echo "::endgroup::"
            echo "Render attempt $attempt failed; likely a transient TeX package fetch. Retrying in 30s..."
            sleep 30
          done
          echo "Render failed after 2 attempts."
          exit 1

      # NOTE: deploy-pages@v4 fails with "Found 2 artifact(s)" + HTTP 422
      # (Validation Failed) whenever the deploying run contains more than one
      # artifact, and it cannot yet be pinned to a specific artifact id. So the
      # run must upload EXACTLY ONE artifact — the Pages tarball below. The
      # rendered book is still downloadable from that "github-pages" artifact
      # (it contains the full _book/ tree), so a separate "book" upload is
      # redundant; re-adding one would reintroduce the deploy failure.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _book/

  # Publish the rendered book to GitHub Pages — only for pushes to main, so PRs
  # still get a render check without deploying. Live site:
  # https://jlhf80.github.io/mmm_foundational_text/
  deploy:
    needs: render
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Serialize Pages deployments: rapid back-to-back merges to main would
    # otherwise overlap and GitHub rejects the second with "due to in progress
    # deployment" (HTTP 400). Queue them instead; let an in-progress production
    # deploy finish (do not cancel), and only the latest pending run survives.
    # Scoped to the deploy job so PR render checks stay parallel.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
