project:
  type: book
  resources:
    - CNAME
    - og-card.png

# Build with solutions:  quarto render --metadata show-solutions:true
show-solutions: false

book:
  title: "The Mathematics and Engineering of Marketing Mix Modeling"
  site-url: https://book.548marjan.com
  subtitle: "A self-contained path from calculus, linear algebra, and calculus-based statistics to advanced MMM practice."
  # Social preview card (Open Graph + Twitter) — shown when the site is shared.
  image: og-card.png
  open-graph: true
  twitter-card:
    card-style: summary_large_image
  author:
    name: "548 Marjan"
    url: https://www.548marjan.com
  date: today
  search: true
  repo-url: https://github.com/jlhf80/mmm_foundational_text
  repo-actions: [issue]
  page-footer:
    left: "© 2026 [548 Marjan](https://www.548marjan.com). All rights reserved."
    center: "[Privacy](privacy.qmd)"
    right: "Built with [Quarto](https://quarto.org)."
  chapters:
    - index.qmd
    - parts/00-introduction/00-introduction.qmd
    - parts/00-introduction/roadmap.qmd
    - parts/00-introduction/notation.qmd
    - part: "Part I — Mathematical Foundations"
      chapters:
        - parts/01-foundations/01-linear-algebra.qmd
        - parts/01-foundations/02-multivariable-calculus.qmd
        - parts/01-foundations/03-probability-statistics.qmd
    - part: "Part II — Regression & Bayesian Inference"
      chapters:
        - parts/02-regression-bayes/01-linear-regression.qmd
        - parts/02-regression-bayes/02-bayesian-inference.qmd
        - parts/02-regression-bayes/03-hierarchical-regression.qmd
        - parts/02-regression-bayes/04-time-series.qmd
    - part: "Part III — Computation: Sampling"
      chapters:
        - parts/03-sampling/01-markov-chains.qmd
        - parts/03-sampling/02-mcmc.qmd
        - parts/03-sampling/03-hmc-nuts.qmd
        - parts/03-sampling/04-model-checking.qmd
    - part: "Part IV — Optimization"
      chapters:
        - parts/04-optimization/01-convexity.qmd
        - parts/04-optimization/02-linear-programming.qmd
        - parts/04-optimization/03-slsqp.qmd
    - part: "Part V — Marketing Mix Modeling: Modeling"
      chapters:
        - parts/05-mmm-modeling/01-mmm-dgp.qmd
        - parts/05-mmm-modeling/02-building-fitting.qmd
        - parts/05-mmm-modeling/03-dlm.qmd
        - parts/05-mmm-modeling/04-budget-optimization.qmd
    - part: "Part VI — Causal Grounding & Calibration"
      chapters:
        - parts/06-causal-calibration/01-causal-foundations.qmd
        - parts/06-causal-calibration/02-quasi-experimental.qmd
        - parts/06-causal-calibration/03-advanced-calibration.qmd
        - parts/06-causal-calibration/04-prior-store.qmd
    - part: "Part VII — Software Engineering & Computer Science"
      chapters:
        - parts/07-swe-cs/01-cs-foundations.qmd
        - parts/07-swe-cs/02-software-architecture.qmd
        - parts/07-swe-cs/03-data-engineering.qmd
        - parts/07-swe-cs/04-testing-reliability.qmd
    - part: "Part VIII — Capstone"
      chapters:
        - parts/08-capstone/01-putting-it-together.qmd
  appendices:
    - appendix/btvc-mechanics.qmd
    - appendix/solutions.qmd
    - privacy.qmd

bibliography: references.bib

# Reuse computed results so heavy PyMC/MCMC cells don't re-run on every render.
execute:
  freeze: auto

format:
  html:
    theme: [cosmo, theme.scss]
    toc: true
    number-sections: true
    html-math-method: katex
    include-in-header:
      - snitcher-head.html
  pdf:
    documentclass: scrreprt
    number-sections: true
    keep-tex: true
